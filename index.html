<body>
  <script>
    // Apply a saved theme before anything paints, so there is no flash.
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <div id="app"></div>
  <noscript>Deceptive UX Index shows each dark pattern as a small working screen, and it needs JavaScript to run them.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
